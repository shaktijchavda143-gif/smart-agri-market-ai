services:
- type: web
  name: smart-agri-market-ai
  runtime: python
  buildCommand: pip install -r requirements.txt
  startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
  envVars:
  - key: GROQ_API_KEY
    sync: false
  - key: GROQ_TEXT_MODEL
    value: openai/gpt-oss-20b
  - key: GROQ_VISION_MODEL
    value: qwen/qwen3.6-27b
  - key: OPENAI_API_KEY
    sync: false
  - key: OPENAI_MODEL
    value: gpt-5.6-luna
  - key: GEMINI_API_KEY
    sync: false
  - key: VISION_MODEL
    value: gemini-2.5-flash
