# SQLite + JSON mirror use /var/data automatically if a Persistent Disk is mounted.
# Render Free has ephemeral storage and does not support Persistent Disks, so configure
# GITHUB_BACKUP_TOKEN (repo Contents: write) and GITHUB_BACKUP_REPO for durable off-instance
# snapshots. To enable a disk, use a paid plan and uncomment the disk block below; this file
# intentionally does not upgrade the existing Free service or create billing without approval.
services:
  - type: web
    name: smart-agri-market-ai
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    # Paid-plan Persistent Disk option (requires an explicit plan change in Render):
    # plan: starter
    # disk:
    #   name: mukadam-data
    #   mountPath: /var/data
    #   sizeGB: 1
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: XAI_API_KEY
        sync: false
      - key: XAI_MODEL
        value: grok-4.7
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_VISION_MODEL
        value: gemini-3.6-flash
      - key: DATA_GOV_API_KEY
        sync: false
      - key: DATA_GOV_RESOURCE_ID
        value: 9ef84268-d588-465a-a308-a864a43d0070
      - key: DATA_GOV_BASE_URL
        value: https://api.data.gov.in
      - key: CEDA_API_KEY
        sync: false
      # Optional durable Mukadam snapshots for instances without a Persistent Disk.
      - key: GITHUB_BACKUP_TOKEN
        sync: false
      - key: GITHUB_BACKUP_REPO
        sync: false
      - key: GITHUB_BACKUP_PATH
        value: backups/mukadam_data.json
      - key: MANDI_FALLBACK_MAX_AGE_HOURS
        value: "96"
      # Secure Admin Panel Bootstrap & Session Configuration (Set values in Render Dashboard):
      - key: ADMIN_BOOTSTRAP_USERNAME
        sync: false
      - key: ADMIN_BOOTSTRAP_PASSWORD
        sync: false
      - key: ADMIN_BOOTSTRAP_DISPLAY_NAME
        value: "મુખ્ય એડમિન (Super Admin)"
      - key: ADMIN_RESET_MASTER_SECRET
        sync: false
      - key: ADMIN_SESSION_TTL_SECONDS
        value: "28800"
      - key: ADMIN_SESSION_IDLE_SECONDS
        value: "7200"
